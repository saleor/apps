# CI for the public OSS mirror of saleor-apps.
#
# This file is managed in the PRIVATE repository (oss/public-overlay/) and
# replaces .github/workflows here on every sync. Its job is to prove that the
# exported subset is self-contained and buildable — the authoritative backstop
# for the private/public split. If this goes red after a sync, the export
# leaked a dependency on private code or shipped a broken lockfile.
name: QA

on:
  push:
    branches:
      - main
      # public-mirror only exists in the private repository, where a green run
      # here is what triggers publication to this repo. Dead branch name here,
      # load-bearing there -- do not "clean up".
      - public-mirror
  pull_request:
    types:
      - synchronize
      - opened

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    env:
      HUSKY: 0
      APL: file
      MAILCHIMP_CLIENT_ID: "mocked"
      MAILCHIMP_CLIENT_SECRET: "mocked"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup PNPM
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - name: Install dependencies (frozen lockfile — proves the exported lockfile is valid)
        run: pnpm install --frozen-lockfile
      - name: Check linter
        run: pnpm lint
      - name: Check types
        run: pnpm check-types
      - name: Check package dependencies
        run: pnpm lint:packages
      - name: Check for changes in graphql files
        run: |
          pnpm generate
          git diff --name-status --exit-code .

  test:
    runs-on: ubuntu-24.04
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup PNPM
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm test:ci
